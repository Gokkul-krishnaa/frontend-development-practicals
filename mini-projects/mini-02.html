        <h1>Mini Project 2: Digital clock</h1>
        <p>Digital clock</p>
      </section>
      <section class="card">
        <h2>Working Demonstration</h2>
        <div class="demo">
          <h1 id="clock"></h1>
          <script>
            setInterval(
              () => (clock.textContent = new Date().toLocaleTimeString()),
              1000,
            );
          </script>
        </div>
      </section>
      <details class="card">
        <summary><strong>View student-friendly code</strong></summary>
        <pre><code>&lt;h1 id=&quot;clock&quot;&gt;&lt;/h1&gt;&lt;script&gt;setInterval(()=&gt;clock.textContent=new Date().toLocaleTimeString(),1000)&lt;/script&gt;</code></pre>
      </details>
